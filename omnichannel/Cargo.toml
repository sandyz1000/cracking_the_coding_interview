[package]
name = "omnichannel"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "json"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tower-http = { version = "0.7.0", features = ["cors"] }
chrono = { version = "0.4.45", features = ["serde"] }

[[bin]]
name = "flight-booking"
path = "src/flight-booking.rs"

[[bin]]
name = "movie-ticket-booking"
path = "src/movie-ticket-booking.rs"

[[bin]]
name = "social-media"
path = "src/social-media.rs"
